[project]
name = "pawprints_api"
version = "2.0.0"
description = "Pawprints 2.0 API - RIT Student Government Petition Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.1",
    "pydantic[email]>=2.12.4",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy-utils>=0.42.0",
    "pendulum>=3.1.0",
    "greenlet>=3.2.4",
    "certbot>=3.1.0",
    "fastapi-sessions>=0.3.2",
    "pysaml2>=7.5.4",
    "dicttoxml>=1.7.16",
    "python-multipart>=0.0.20",
    "jose>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.2.1",
    "email-validator>=2.3.0",
    "gunicorn>=23.0.0",
    "boto3>=1.35.0",
    "minio>=7.2.0",
    "sniffio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "black>=25.9.0",
    "ruff>=0.13.3",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "detect-secrets>=1.5.0",
    "faker>=37.11.0",
    "boto3-stubs[s3]>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pawprints"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
  \.venv
 | \.pytest_cache
 | build
 | dist
 | node_modules
 | migrations
)/
'''

[tool.ruff]
line-length = 150
target-version = "py312"
extend-exclude = ["migrations", "node_modules", "build", "dist", ".venv", ".pytest_cache"]

# Rule selection (ruff >= 0.4)
lint.select = [
  "E", "F", "W",      # pycodestyle/pyflakes
  "B",                # flake8-bugbear
  "I",                # isort
  "UP",               # pyupgrade
  "C90",              # mccabe
  "SIM",              # flake8-simplify
  "ASYNC",
  "PT"
]
# Black compatibility
lint.ignore = ["E203", "UP006", "B008", "B904"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["pawprints"]

[tool.ruff.format]
quote-style = "preserve"

[tool.uv]
# Always use project-local virtual environment
# This ensures packages are installed in .venv/ not system-wide
managed = true

[tool.uv.sources]
# All packages come from PyPI by default

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "black>=25.9.0",
    "ruff>=0.13.3",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "detect-secrets>=1.5.0",
    "faker>=37.11.0",
]
